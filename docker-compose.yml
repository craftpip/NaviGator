name: navigator

services:
  navigator:
    container_name: "navigator"
    image: navigator:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
    shm_size: "2gb"
    init: true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
        reservations:
          cpus: "4.0"
          memory: 4g

    environment:
      # All configuration is defined in the .env file (see .env.example).
      # These entries read from it and fall back to sane defaults when unset.
      HEADLESS: ${HEADLESS:-true}
      BROWSER_BACKEND: ${BROWSER_BACKEND:-cloakbrowser}
      BROWSER_USER_AGENT: ${BROWSER_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36}
      ENABLE_VNC: ${ENABLE_VNC:-1}
      ENABLE_WEB_CONSOLE: ${ENABLE_WEB_CONSOLE:-1}
      ENABLE_HTTP_MCP: ${ENABLE_HTTP_MCP:-1}
      MCP_API_KEYS: ${MCP_API_KEYS:-}
      MCP_ALLOW_UNAUTHENTICATED: ${MCP_ALLOW_UNAUTHENTICATED:-1}
      ENABLE_DEVTOOLS_MCP: ${ENABLE_DEVTOOLS_MCP:-1}
      DEVTOOLS_BROWSER_BACKEND: ${DEVTOOLS_BROWSER_BACKEND:-${BROWSER_BACKEND:-cloakbrowser}}
      MCP_API_PORT: ${MCP_API_PORT:-3000}
      BROWSER_OP_TIMEOUT_MS: ${BROWSER_OP_TIMEOUT_MS:-25000}
      NAV_WAIT_UNTIL: ${NAV_WAIT_UNTIL:-domcontentloaded}
      PRELAUNCH_BROWSER: ${PRELAUNCH_BROWSER:-1}

      SEARCH_ROUTE_WARMUP_ENGINES: ${SEARCH_ROUTE_WARMUP_ENGINES:-}
      SEARCH_ENABLED_ENGINES: ${SEARCH_ENABLED_ENGINES:-}
      SEARCH_ROUTE_CIRCUIT_OPEN_MS: ${SEARCH_ROUTE_CIRCUIT_OPEN_MS:-300000}
      SEARCH_QUEUE_MIN_INTERVAL_MS: "${SEARCH_QUEUE_MIN_INTERVAL_MS:-30000}"
      SEARCH_QUEUE_MAX_INTERVAL_MS: "${SEARCH_QUEUE_MAX_INTERVAL_MS:-1800000}"
      SEARCH_QUEUE_ESCALATION_FACTOR: "${SEARCH_QUEUE_ESCALATION_FACTOR:-2}"
      SEARCH_QUEUE_ERROR_GAP_PERCENTILE: "${SEARCH_QUEUE_ERROR_GAP_PERCENTILE:-0.75}"
      SEARCH_QUEUE_ERROR_GAP_SAFETY: "${SEARCH_QUEUE_ERROR_GAP_SAFETY:-1.25}"
      SEARCH_QUEUE_DECAY_PER_SUCCESS: "${SEARCH_QUEUE_DECAY_PER_SUCCESS:-0.75}"
      SEARCH_QUEUE_W_LATENCY: "${SEARCH_QUEUE_W_LATENCY:-0.2}"
      SEARCH_KEEP_MIN_WORKING_WINDOWS: ${SEARCH_KEEP_MIN_WORKING_WINDOWS:-2}
      SEARCH_MAX_WORKING_WINDOWS: ${SEARCH_MAX_WORKING_WINDOWS:-4}

      OPEN_PAGE_MAX_PARALLEL: ${OPEN_PAGE_MAX_PARALLEL:-4}
      MAX_CONCURRENT_PAGE_OPS: ${MAX_CONCURRENT_PAGE_OPS:-30}
      HUMAN_TYPING_DELAY: ${HUMAN_TYPING_DELAY:-0}

      CHROME_PATH: ${CHROME_PATH:-/usr/bin/chromium}
      CHROME_USER_DATA_DIR: ${CHROME_USER_DATA_DIR:-/data/chrome}
      CHROME_PROFILE_DIR: ${CHROME_PROFILE_DIR:-Default}
      STARTUP_URL: ${STARTUP_URL:-about:blank}
      LIGHTPANDA_PORT: ${LIGHTPANDA_PORT:-9222}

      VNC_PORT: ${VNC_PORT:-5900}
      NOVNC_PORT: ${NOVNC_PORT:-7900}

      ENABLE_HTTP_HEALTH: ${ENABLE_HTTP_HEALTH:-1}
      MCP_API_HOST: ${MCP_API_HOST:-http://localhost}

      ENABLE_SCREENSHOT_DOWNLOAD_LINK: ${ENABLE_SCREENSHOT_DOWNLOAD_LINK:-0}
      ENABLE_SCREENSHOT_PATH: ${ENABLE_SCREENSHOT_PATH:-}

      ENABLE_HANG_RESTART: ${ENABLE_HANG_RESTART:-0}
      HANG_RESTART_TIMEOUT_MS: ${HANG_RESTART_TIMEOUT_MS:-120000}

      # DuckDuckGo Instant Answers on every web_search (rendered as the
      # **Instant Answer:** section between the query and the results).
      ENABLE_INSTANT_ANSWERS: ${ENABLE_INSTANT_ANSWERS:-1}

      # Disable MCP tools by name (comma-separated, case-insensitive). Add any
      # tool to hide it from tools/list and reject its calls. Values come from
      # the .env file (DISABLE_TOOLS) — empty means all tools enabled.
      # Example: web_page_ascii,web_page_links
      DISABLE_TOOLS: ${DISABLE_TOOLS:-}

      # AI Model extractor — an OpenAI-compatible endpoint serving a reader-lm
      # model (e.g. jinaai/reader-lm-0.5b). Each AI_EXTRACTOR_MODELS entry becomes
      # an "(AI extractor)" option in the console's Extractor dropdowns.
      AI_EXTRACTOR_MODELS: ${AI_EXTRACTOR_MODELS:-}
      AI_EXTRACTOR_BASE_URL: ${AI_EXTRACTOR_BASE_URL:-}
      AI_EXTRACTOR_MODEL: ${AI_EXTRACTOR_MODEL:-}
      AI_EXTRACTOR_TIMEOUT_MS: ${AI_EXTRACTOR_TIMEOUT_MS:-60000}
      AI_EXTRACTOR_MAX_INPUT_CHARS: ${AI_EXTRACTOR_MAX_INPUT_CHARS:-60000}
      AI_EXTRACTOR_MAX_TOKENS: ${AI_EXTRACTOR_MAX_TOKENS:-8192}

      # Default extraction settings for pages with no matching domain hint.
      # Each is editable in the console: Manage → Web Fetch Extraction.
      # Empty stabilize strategy falls back to network_idle.
      DEFAULT_EXTRACT_FORMAT: ${DEFAULT_EXTRACT_FORMAT:-}
      DEFAULT_EXTRACT_STABILIZE_STRATEGY: ${DEFAULT_EXTRACT_STABILIZE_STRATEGY:-}
      DEFAULT_EXTRACT_SKIP_SELECTORS: ${DEFAULT_EXTRACT_SKIP_SELECTORS:-}
      DEFAULT_EXTRACT_WAIT_FOR_SELECTOR: ${DEFAULT_EXTRACT_WAIT_FOR_SELECTOR:-}
      DEFAULT_EXTRACT_WAIT_FOR_CONTENT: ${DEFAULT_EXTRACT_WAIT_FOR_CONTENT:-}
    volumes:
      - .:/app
      - /tmp/screenshots:/app/screenshots
      - chrome_profile_data:/data/chrome
    ports:
      - "${MCP_API_PORT:-3000}:${MCP_API_PORT:-3000}"
      - "${NOVNC_PORT:-7900}:${NOVNC_PORT:-7900}"
    stdin_open: true
    tty: true

  # MinerU-HTML v1.1 GPU sidecar — an "AI Model" extractor for web_fetch.
  # Serves POST /extract {html} -> {text} (markdown) on port 8001. Independent
  # of navigator: if this container is down, navigator's AI extractor falls
  # back to html_to_markdown (existing fallback semantics). See
  # docker/navigator-mineru/sidecar.py and plans/23_mineru-html-extractor.md.
  #
  # Every runtime knob is settable from .env (see .env.example). The knob you
  # most likely want on a bigger GPU is MINERU_CONTEXT_WINDOW — KV cache is
  # ~96 KiB/token (13312 ~= 1.2 GiB / 32768 ~= 3.0 GiB / 65536 ~= 6.0 GiB).
  navigator-mineru:
    container_name: navigator-mineru
    image: navigator-mineru:latest
    restart: unless-stopped
    build:
      context: ./docker/navigator-mineru
      dockerfile: Dockerfile
    runtime: nvidia
    shm_size: "2gb"
    environment:
      # GPU(s) to expose. "all" = every GPU; a UUID or index selects one.
      NVIDIA_VISIBLE_DEVICES: ${MINERU_GPU:-all}
      # Backend: "vllm" (default) or "transformers". vLLM auto-falls back to
      # transformers on init failure (e.g. low-VRAM GPUs like the GTX 1650).
      MINERU_BACKEND: ${MINERU_BACKEND:-vllm}
      # Model weights are baked into the image at this path.
      MINERU_MODEL_PATH: ${MINERU_MODEL_PATH:-/app/model}
      # Context window (tokens) for the classification prompt. Bigger GPU ->
      # bigger window (see sizing above). Pages whose prompt overflows the
      # window fall back to trafilatura instead of the model.
      MINERU_CONTEXT_WINDOW: ${MINERU_CONTEXT_WINDOW:-13312}
      # Fraction of VRAM given to vLLM (KV cache + activations). Keep high.
      MINERU_GPU_MEM_UTIL: ${MINERU_GPU_MEM_UTIL:-0.95}
      # Incoming HTML is tail-cut at this many chars before extraction
      # (tables/footnotes live at the end; keep generous on big GPUs).
      MINERU_MAX_INPUT_CHARS: ${MINERU_MAX_INPUT_CHARS:-400000}
      # Multi-GPU tensor parallelism. 1 = single GPU.
      MINERU_TENSOR_PARALLEL_SIZE: ${MINERU_TENSOR_PARALLEL_SIZE:-1}
      # true = no CUDA graphs (lower VRAM, slower). Set false on CC >= 8.0
      # cards for CUDA-graph speedups.
      MINERU_ENFORCE_EAGER: ${MINERU_ENFORCE_EAGER:-true}
      # Model dtype. "" = auto (vLLM picks). bfloat16 needs CC >= 8.0.
      MINERU_DTYPE: ${MINERU_DTYPE:-}
      # Sampling. The model only emits a tiny main/other classification, so
      # defaults are near-greedy and fine as-is.
      MINERU_MAX_TOKENS: ${MINERU_MAX_TOKENS:-16384}
      MINERU_TOP_K: ${MINERU_TOP_K:-1}
      MINERU_TOP_P: ${MINERU_TOP_P:-0.95}
      MINERU_TEMPERATURE: ${MINERU_TEMPERATURE:-0}
      # Concurrent /extract requests allowed. 0 = auto (2 for vllm, 1 for
      # transformers — the transformers pipeline is not concurrency-safe).
      MINERU_GATE_CONCURRENCY: ${MINERU_GATE_CONCURRENCY:-0}
      # Fallback when the LLM path fails or the page overflows the window:
      # "trafilatura" (default) | "bypass" | "empty".
      MINERU_USE_FALLBACK: ${MINERU_USE_FALLBACK:-trafilatura}
      # Converter output format: plain_md (default) | mm_md | md | json | txt.
      MINERU_OUTPUT_FORMAT: ${MINERU_OUTPUT_FORMAT:-plain_md}
      # vLLM attention backend: TRITON_ATTN works on CC 7.5 (GTX 1650);
      # FLASH_ATTN is faster on CC >= 8.0. Translated to VLLM_ATTENTION_BACKEND
      # inside sidecar.py before vLLM imports.
      MINERU_VLLM_ATTENTION_BACKEND: ${MINERU_VLLM_ATTENTION_BACKEND:-TRITON_ATTN}
      # PyTorch allocator for fragmented-VRAM GPUs. Translated to
      # PYTORCH_CUDA_ALLOC_CONF inside sidecar.py before torch imports.
      MINERU_PYTORCH_CUDA_ALLOC_CONF: ${MINERU_PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    deploy:
      resources:
        limits:
          memory: ${MINERU_MEM_LIMIT:-8g}
    ports:
      - "${MINERU_PORT:-8001}:8001"

volumes:
  chrome_profile_data:
    name: navigator_chrome_profile_data
