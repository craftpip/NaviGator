services:
  web:
    image: node:22-alpine
    container_name: example-com
    working_dir: /www
    command: ["node", "server.js"]
    ports:
      # Publish the container's internal 8080 to a RANDOM host port so we never
      # occupy 8080 on the host (the test website's port is random now).
      # Find the actual host port with: docker port example-com 8080
      - "8080"
    volumes:
      - /www1/examples.com:/www
    restart: unless-stopped
