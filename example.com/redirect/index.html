<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="3; url=/post/">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f3460; color: #fff; }
    .card { text-align: center; padding: 30px; }
    .bar { width: 220px; height: 6px; background: rgba(255,255,255,0.25); border-radius: 3px; margin: 18px auto 0; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #ffd166; border-radius: 3px; animation: grow 3s linear forwards; }
    @keyframes grow { to { width: 100%; } }
    a { color: #ffd166; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redirecting you…</h1>
    <p>This is a simulated redirect page. You will be taken to <a href="/post/">the blog post</a> in 3 seconds.</p>
    <p style="font-size:0.85em;color:#aab">If nothing happens, <a href="/post/">click here</a>.</p>
    <div class="bar"><div class="fill"></div></div>
  </div>
  <script>
    setTimeout(function () { location.href = '/post/'; }, 3000);
  </script>
</body>
</html>
