<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPA Demo — JavaScript-Rendered Content</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #222; background: #fff; }
    header { background: #222; color: #fff; padding: 14px 20px; }
    main { max-width: 760px; margin: 24px auto; padding: 0 20px; }
    h1 { font-size: 1.9em; }
    table { border-collapse: collapse; width: 100%; margin: 14px 0; }
    th, td { border: 1px solid #ccc; padding: 7px 10px; text-align: left; }
    th { background: #333; color: #fff; }
    .loading { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <strong>WidgetDash SPA</strong> — nothing here renders without JavaScript
  </header>
  <main>
    <!-- The app is an empty shell. All content is produced by JS below,
         simulating a client-side-rendered framework like React or Vue. -->
    <div id="app">
      <p class="loading">Loading application…</p>
    </div>
  </main>
  <script>
    // Simulates a framework mounting + a fast API response.
    // Kept short so extractors that wait for network-idle see the rendered
    // article; real SPAs fetch over the network, which delays similarly.
    setTimeout(function () {
      var article = [
        { tag: 'h1', html: 'Q3 Product Overview' },
        { tag: 'p', html: 'This entire article was generated by JavaScript after page load. A static fetch of the raw HTML would see only the loading message above.' },
        { tag: 'h2', html: 'Key metrics' },
        { tag: 'table', html:
          '<thead><tr><th>Metric</th><th>Q2</th><th>Q3</th><th>Change</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>Active users</td><td>48,200</td><td>61,500</td><td>+28%</td></tr>' +
            '<tr><td>New signups</td><td>9,100</td><td>11,800</td><td>+30%</td></tr>' +
            '<tr><td>Churn rate</td><td>4.1%</td><td>3.2%</td><td>−22%</td></tr>' +
            '<tr><td>Revenue (USD)</td><td>1.2M</td><td>1.6M</td><td>+33%</td></tr>' +
          '</tbody>'
        },
        { tag: 'h2', html: 'Notes' },
        { tag: 'ul', html:
          '<li>Growth driven by the mobile app relaunch</li>' +
          '<li>Churn lowest among annual plans</li>' +
          '<li>Expansion into EU market starts next quarter</li>'
        }
      ];
      var html = article.map(function (b) {
        return b.tag === 'table' ? b.html : '<' + b.tag + '>' + b.html + '</' + b.tag + '>';
      }).join('');
      document.getElementById('app').innerHTML = html;
    }, 150);
  </script>
</body>
</html>
