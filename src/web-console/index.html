<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigator Console</title>
    <script>
      if (localStorage.getItem("navigator-theme") === "dark") document.documentElement.dataset.theme = "dark";
    </script>
    <style>
      html, body { margin: 0; background: #f3f4f6; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #101217; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
